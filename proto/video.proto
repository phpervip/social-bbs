// Video Service gRPC contract (P3 — frozen. Gateway & Video Service generate stubs from this file.)
syntax = "proto3";

package video.v1;

option go_package = "social-bbs/video-service/proto/gen;videopb";

// ---- Shared ----

message CursorPage {
  int64 cursor = 1;
  int32 limit = 2;
}

message Empty {}

// ---- Video ----

enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  VIDEO_STATUS_PENDING    = 1;
  VIDEO_STATUS_PROCESSING = 2;
  VIDEO_STATUS_COMPLETED  = 3;
  VIDEO_STATUS_FAILED     = 4;
}

enum VideoVisibility {
  VIDEO_VISIBILITY_UNSPECIFIED    = 0;
  VIDEO_VISIBILITY_PUBLIC         = 1;
  VIDEO_VISIBILITY_FOLLOWERS_ONLY = 2;
  VIDEO_VISIBILITY_PRIVATE        = 3;
}

message Video {
  int64 id = 1;
  int64 uploader_id = 2;
  string title = 3;
  string description = 4;
  VideoVisibility visibility = 5;
  VideoStatus status = 6;
  string raw_key = 7;
  string hls_key = 8;
  string thumb_key = 9;
  int64 duration = 10;  // seconds
  int64 created_at = 11; // unix ms
}

// ---- Upload ----

message InitUploadRequest {
  int64 user_id = 1;
  string filename = 2;
  string content_type = 3;
  int64 total_size = 4;
}

message InitUploadResponse {
  string upload_id = 1;
  int64 video_id = 2;
  repeated int32 uploaded_chunks = 3; // already uploaded part numbers (resume)
}

message UploadChunkRequest {
  int64 user_id = 1;
  string upload_id = 2;
  int32 part_number = 3;
  bytes data = 4;
}

message UploadChunkResponse {
  int32 part_number = 1;
  int64 etag_bytes = 2; // size uploaded
}

message CompleteUploadRequest {
  int64 user_id = 1;
  string upload_id = 2;
  string title = 3;
  string description = 4;
  VideoVisibility visibility = 5;
}

message CompleteUploadResponse {
  Video video = 1;
}

// ---- Query ----

message GetVideoRequest {
  int64 video_id = 1;
  int64 viewer_id = 2;
}

message GetPlaybackURLRequest {
  int64 video_id = 1;
  int64 user_id = 2;
}

message GetPlaybackURLResponse {
  string playback_url = 1;  // signed HLS .m3u8 URL
  string thumbnail_url = 2; // signed thumbnail URL
}

message GetTranscodeStatusRequest {
  int64 video_id = 1;
}

message GetTranscodeStatusResponse {
  VideoStatus status = 1;
  repeated TranscodeTaskInfo tasks = 2;
}

message TranscodeTaskInfo {
  string quality = 1;
  VideoStatus status = 2;
  int32 retry_count = 3;
}

message DeleteVideoRequest {
  int64 video_id = 1;
  int64 user_id = 2;
}

message ListUserVideosRequest {
  int64 user_id = 1;
  int64 viewer_id = 2;
  CursorPage page = 3;
}

message ListUserVideosResponse {
  repeated Video videos = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
}

// ---- Service ----

service VideoService {
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc GetVideo(GetVideoRequest) returns (Video);
  rpc GetPlaybackURL(GetPlaybackURLRequest) returns (GetPlaybackURLResponse);
  rpc GetTranscodeStatus(GetTranscodeStatusRequest) returns (GetTranscodeStatusResponse);
  rpc DeleteVideo(DeleteVideoRequest) returns (Empty);
  rpc ListUserVideos(ListUserVideosRequest) returns (ListUserVideosResponse);
}
